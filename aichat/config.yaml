# aichat configuration
# https://github.com/sigoden/aichat/blob/main/config.example.yaml

# ---- Model ----
model: gemini:gemini-3.6-flash

# ---- Behavior ----
stream: true
save: true
keybindings: emacs
wrap: auto
wrap_code: false

# ---- Session ----
save_session: true
compress_threshold: 4000
summarize_prompt: "Summarize the discussion briefly in 200 words or less to use as a prompt for future context."
summary_prompt: "This is a summary of the chat history as a recap: "

# ---- Appearance ----
highlight: true
# theme: dark | light (unset = dark). aichat 0.30 ignores the old light_theme key.
left_prompt: "{color.green}{model}{color.cyan}>{color.reset} "
right_prompt: "{color.purple}{?consume_tokens {consume_tokens}}{color.reset}"

# ---- Misc ----
save_shell_history: true

# ---- Clients ----
# Switch models with: .model <provider>:<model-name>
# List available: .model
clients:
  # Google Gemini
  # API key loaded from GEMINI_API_KEY environment variable
  - type: gemini
    # Listing models here replaces aichat's built-in Gemini list, so every
    # model that should appear in .model is declared. The 3.x names are newer
    # than aichat's model database.
    models:
      - name: gemini-3.6-flash
        max_input_tokens: 1048576
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
      - name: gemini-3.8-flash
        max_input_tokens: 1048576
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
      - name: gemini-3.5-flash-lite
        max_input_tokens: 1048576
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
      - name: gemini-2.5-flash
        max_input_tokens: 1048576
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true
      - name: gemini-2.5-pro
        max_input_tokens: 1048576
        max_output_tokens: 65536
        supports_vision: true
        supports_function_calling: true

# OpenAI / ChatGPT
# Set OPENAI_API_KEY environment variable
# - type: openai
#   # Models: gpt-4o, gpt-4o-mini, gpt-4-turbo, o1, o1-mini

# Anthropic / Claude
# Set ANTHROPIC_API_KEY environment variable
# - type: claude
#   # Models: claude-sonnet-4-20250514, claude-opus-4-20250514, claude-3-5-haiku-20241022

# Groq (fast inference)
# Set GROQ_API_KEY environment variable
# - type: groq
#   # Models: llama-3.3-70b-versatile, mixtral-8x7b-32768

# Mistral
# Set MISTRAL_API_KEY environment variable
# - type: mistral
#   # Models: mistral-large-latest, mistral-small-latest, codestral-latest

# OpenRouter (access to many models)
# Set OPENROUTER_API_KEY environment variable
# - type: openai-compatible
#   name: openrouter
#   api_base: https://openrouter.ai/api/v1
#   # Models: anthropic/claude-3.5-sonnet, openai/gpt-4o, google/gemini-pro-1.5

# Local Ollama
# - type: ollama
#   api_base: http://localhost:11434
#   # Models: llama3, codellama, mistral, phi3
