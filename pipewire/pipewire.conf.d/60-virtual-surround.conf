# Virtual 7.1 surround for headphones.
#
# A sink with eight channels that renders each one binaurally -- as a sound
# from that speaker's direction -- into plain stereo, so a game's or film's
# 5.1/7.1 mix keeps its positions on a two-driver headset. It is the same idea
# as the virtual surround a headset vendor ships for Windows: the headset only
# ever receives stereo.
#
# Pick it per application; it is not meant to be the default output. Stereo
# sources gain nothing from it and are audibly coloured by it. Its own output
# follows the default output, so it plays on whatever headphones are current
# and names no device that would be wrong on the next machine.
#
# Rendering is libmysofa's MIT KEMAR head-related transfer function, shipped
# with libmysofa (a pipewire-audio dependency). Directions are azimuths in
# degrees, counterclockwise from straight ahead, at the usual 7.1 angles:
# fronts 30, sides 90, rears 150. LFE has no direction and goes equally to
# both ears.
#
# Every mixer input is at -6 dB. Measured with pink noise through this graph:
# one channel comes out about 3 dB hotter at its peaks, and eight uncorrelated
# channels about 8.4 dB hotter, so a dense game mix at unity gain clips.

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Virtual Surround 7.1 (headphones)"
            media.name       = "Virtual Surround 7.1 (headphones)"
            filter.graph = {
                nodes = [
                    { type = sofa label = spatializer name = spFL
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spFR
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spFC
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 0.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spRL
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 150.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spRR
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 210.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spSL
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 90.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = sofa label = spatializer name = spSR
                      config = { filename = "/usr/share/libmysofa/MIT_KEMAR_normal_pinna.sofa" }
                      control = { "Azimuth" = 270.0 "Elevation" = 0.0 "Radius" = 1.0 } }
                    { type = builtin label = copy name = lfe }
                    { type = builtin label = mixer name = mixL
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 "Gain 3" = 0.5 "Gain 4" = 0.5 "Gain 5" = 0.5 "Gain 6" = 0.5 "Gain 7" = 0.5 "Gain 8" = 0.5 } }
                    { type = builtin label = mixer name = mixR
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 "Gain 3" = 0.5 "Gain 4" = 0.5 "Gain 5" = 0.5 "Gain 6" = 0.5 "Gain 7" = 0.5 "Gain 8" = 0.5 } }
                ]
                links = [
                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spFC:Out L" input = "mixL:In 3" }
                    { output = "spRL:Out L" input = "mixL:In 4" }
                    { output = "spRR:Out L" input = "mixL:In 5" }
                    { output = "spSL:Out L" input = "mixL:In 6" }
                    { output = "spSR:Out L" input = "mixL:In 7" }
                    { output = "lfe:Out"    input = "mixL:In 8" }
                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                    { output = "spFC:Out R" input = "mixR:In 3" }
                    { output = "spRL:Out R" input = "mixR:In 4" }
                    { output = "spRR:Out R" input = "mixR:In 5" }
                    { output = "spSL:Out R" input = "mixR:In 6" }
                    { output = "spSR:Out R" input = "mixR:In 7" }
                    { output = "lfe:Out"    input = "mixR:In 8" }
                ]
                inputs  = [ "spFL:In" "spFR:In" "spFC:In" "lfe:In" "spRL:In" "spRR:In" "spSL:In" "spSR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name      = "effect_input.virtual_surround"
                media.class    = Audio/Sink
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
            }
            playback.props = {
                node.name      = "effect_output.virtual_surround"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
