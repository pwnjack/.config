## MONITORS
# Deliberately host-neutral: no connector is named here, so a fresh checkout is
# correct on any hardware.
#
# `highres@highrr`, not `preferred` or bare `highrr`. `preferred` takes the
# EDID preferred timing, which on a high-refresh panel is routinely the 60 Hz
# mode; bare `highrr` can instead choose a lower-resolution faster mode.
# Measured on this machine's 144 Hz panel 2026-08-02 by applying each keyword
# with `hyprctl keyword monitor` and reading the rate back:
#     preferred  ->  2560x1440@59.951
#     highrr     ->  2560x1440@143.998
# After explicitly setting 1024x768@60, `highres@highrr` moved it to
# 2560x1440@143.998, proving the combined form parses and picks highest
# refresh at highest resolution. There is no `highres@highrr` literal in the
# Hyprland 0.56.1 binary because its parser splits on `@` and matches each
# keyword separately; do not disprove it with `strings`. An invalid
# `totalgarbagemode` returned `invalid resolution` and fell back to 59.951, so
# a successful `hyprctl keyword monitor` result is meaningful, not a no-op.
#
# scripts/settings/advanced/monitor.sh appends machine-specific `monitor=` lines
# below this one. A rule naming an output beats this catch-all whatever the
# order, so appending stays correct.
monitor=,highres@highrr,auto,1
