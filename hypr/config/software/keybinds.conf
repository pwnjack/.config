#
# KEYBINDINGS
# macOS-inspired keyboard shortcuts
#
# This file is the only source of truth for the Super+H cheatsheet, which
# renders itself from these lines (rofi/keybinds-cheatsheet.sh). Trailing
# comments are its labels:
#
#   * A bind with a trailing `#` comment is labelled with that comment. `$vars`
#     inside it are resolved, so `# Terminal ($terminal)` reads "Terminal
#     (ghostty)" for whoever is running it.
#   * A bind without one is labelled from its dispatcher, which is why the
#     workspace binds below carry no comments and do not need any.
#   * Binds sharing a modifier, a dispatcher and a label are folded into one
#     row, so `$Mod, 1..0` renders as a single "Super + 1-9, 0, =" line.
#
# `## Heading` comments become the cheatsheet's section headings, in file order.
#

## Modifier Keys
$Mod = SUPER
$Mod2 = ALT

## Applications
bind = $Mod, RETURN, exec, $terminal                # Terminal ($terminal)
bind = $Mod, E, exec, $fileManager                  # File manager ($fileManager)
bind = $Mod, N, exec, $terminal -e $textEditor      # Text editor ($textEditor)
bind = $Mod, T, exec, kwrite                        # Text editor (KWrite)
bind = $Mod, B, exec, $browser                      # Web browser ($browser)
bind = $Mod, S, exec, hyprshot -m region -o $HOME/Pictures/Screenshots -f Screenshot_$(date "+%Y-%m-%d_%H:%M:%S").png -z   # Screenshot a region
bind = $Mod, G, exec, zeditor                       # Code editor (Zed)
bind = $Mod, K, exec, gnome-calculator              # Calculator
bind = $Mod, A, exec, ~/.config/scripts/hyprland/launch-chatbox.sh   # AI assistant sidebar

## Window Management
bind = $Mod, Q, killactive,
bind = $Mod, W, killactive,
bind = $Mod SHIFT, Q, exit,
bind = $Mod2, F4, killactive,
bind = $Mod, V, togglefloating,
bind = $Mod, F, fullscreen
bind = $Mod SHIFT, F, fullscreen, 1                 # Fullscreen without gaps
bind = $Mod, O, layoutmsg, togglesplit              # Toggle split direction
bind = $Mod, P, pseudo
bind = $Mod SHIFT, V, pin,
bind = $Mod, L, exec, hyprlock                      # Lock screen

## Rofi Menus
bind = $Mod, SPACE, exec, ~/.config/rofi/launcher.sh                 # App launcher
bind = $Mod SHIFT, L, exec, ~/.config/rofi/powermenu.sh              # Power menu
bind = $Mod SHIFT, S, exec, ~/.config/rofi/screenshot.sh             # Screenshot menu
bind = $Mod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy   # Clipboard history
bind = $Mod, period, exec, rofi -modi emoji -show emoji              # Emoji picker
bind = $Mod, H, exec, ~/.config/rofi/keybinds-cheatsheet.sh          # This cheatsheet

## Notifications
bind = $Mod SHIFT, N, exec, swaync-client -t -sw    # Toggle notification sidebar

## Waybar
bind = $Mod SHIFT, B, exec, ~/.config/scripts/waybar/waybar.sh         # Restart Waybar
bind = $Mod ALT, B, exec, ~/.config/scripts/waybar/waybartoggle.sh     # Show/hide Waybar

## Settings & Utilities
bind = $Mod, I, exec, astal -i settings-panel --toggle-window settings-panel   # Settings panel
bind = $Mod SHIFT, W, exec, waypaper --random       # Random wallpaper
bind = $Mod CTRL, W, exec, waypaper                 # Wallpaper picker
bind = CTRL SHIFT, ESCAPE, exec, resources          # System monitor
bind = $Mod SHIFT, D, exec, ~/.config/scripts/hyprland/nightlight.sh toggle   # Toggle night light
bind = $Mod CTRL, D, exec, ~/.config/scripts/hyprland/nightlight.sh auto      # Night light: follow schedule

## Workspaces
bind = $Mod, 1, workspace, 1
bind = $Mod, 2, workspace, 2
bind = $Mod, 3, workspace, 3
bind = $Mod, 4, workspace, 4
bind = $Mod, 5, workspace, 5
bind = $Mod, 6, workspace, 6
bind = $Mod, 7, workspace, 7
bind = $Mod, 8, workspace, 8
bind = $Mod, 9, workspace, 9
bind = $Mod, 0, workspace, 10
bind = $Mod, EQUAL, workspace, 11

bind = $Mod SHIFT, 1, movetoworkspace, 1
bind = $Mod SHIFT, 2, movetoworkspace, 2
bind = $Mod SHIFT, 3, movetoworkspace, 3
bind = $Mod SHIFT, 4, movetoworkspace, 4
bind = $Mod SHIFT, 5, movetoworkspace, 5
bind = $Mod SHIFT, 6, movetoworkspace, 6
bind = $Mod SHIFT, 7, movetoworkspace, 7
bind = $Mod SHIFT, 8, movetoworkspace, 8
bind = $Mod SHIFT, 9, movetoworkspace, 9
bind = $Mod SHIFT, 0, movetoworkspace, 10
bind = $Mod SHIFT, EQUAL, movetoworkspace, 11

bind = $Mod CTRL, 1, movetoworkspacesilent, 1
bind = $Mod CTRL, 2, movetoworkspacesilent, 2
bind = $Mod CTRL, 3, movetoworkspacesilent, 3
bind = $Mod CTRL, 4, movetoworkspacesilent, 4
bind = $Mod CTRL, 5, movetoworkspacesilent, 5
bind = $Mod CTRL, 6, movetoworkspacesilent, 6
bind = $Mod CTRL, 7, movetoworkspacesilent, 7
bind = $Mod CTRL, 8, movetoworkspacesilent, 8
bind = $Mod CTRL, 9, movetoworkspacesilent, 9
bind = $Mod CTRL, 0, movetoworkspacesilent, 10
bind = $Mod CTRL, EQUAL, movetoworkspacesilent, 11

bind = $Mod, left, workspace, r-1                   # Previous/next workspace
bind = $Mod, right, workspace, r+1                  # Previous/next workspace
bind = $Mod CTRL, left, movetoworkspacesilent, r-1  # Move window to prev/next workspace, stay here
bind = $Mod CTRL, right, movetoworkspacesilent, r+1 # Move window to prev/next workspace, stay here
bind = $Mod SHIFT, left, movetoworkspace, r-1       # Move window to prev/next workspace and follow
bind = $Mod SHIFT, right, movetoworkspace, r+1      # Move window to prev/next workspace and follow

## Window Focus & Movement
bind = $Mod2, left, movefocus, l
bind = $Mod2, right, movefocus, r
bind = $Mod2, up, movefocus, u
bind = $Mod2, down, movefocus, d

bind = $Mod, TAB, cyclenext
bind = $Mod SHIFT, TAB, cyclenext, prev

bind = $Mod2 CTRL, left, resizeactive, -50 0
bind = $Mod2 CTRL, right, resizeactive, 50 0
bind = $Mod2 CTRL, up, resizeactive, 0 -50
bind = $Mod2 CTRL, down, resizeactive, 0 50

bind = $Mod2 SHIFT, left, movewindow, l
bind = $Mod2 SHIFT, right, movewindow, r
bind = $Mod2 SHIFT, up, movewindow, u
bind = $Mod2 SHIFT, down, movewindow, d

## Mouse Bindings
bindm = $Mod, mouse:272, movewindow                 # Move window (drag)
bindm = $Mod, mouse:273, resizewindow               # Resize window (drag)

## Media Keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 2%+   # Volume up
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-          # Volume down
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle                # Mute output
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle           # Mute microphone

bind = ,XF86Calculator, exec, gnome-calculator      # Calculator

bindl = ,XF86AudioNext, exec, playerctl next        # Next track
bindl = ,XF86AudioPause, exec, playerctl play-pause # Play/pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause  # Play/pause
bindl = ,XF86AudioPrev, exec, playerctl previous    # Previous track
