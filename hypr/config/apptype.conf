#
# Application Type Configuration
# Defines default applications for common tasks
#

$fileManager = thunar        # GUI file manager (yazi for CLI)
$textEditor = nvim           # Text editor (neovim)
# Authentication agent, named as its systemd user unit. The hyprpolkitagent
# package ships no executable on PATH — only /usr/lib/hyprpolkitagent/… plus
# this unit — so autostart.conf starts the unit rather than running a command.
$polkitAgent = hyprpolkitagent.service
