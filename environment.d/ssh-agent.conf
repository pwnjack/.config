# SSH_AUTH_SOCK for the whole graphical session. The systemd user manager reads
# environment.d at login; uwsm starts Hyprland under it, so every app, terminal
# and shell inherits this. The socket is OpenSSH's ssh-agent.socket, enabled by
# scripts/ssh/setup.sh. checks/ssh.sh reads the path from this line.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
